<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f64e0"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Saints Baseball"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="config.js"></script>
<title>Saints Baseball</title>
<style>
html,body{margin:0;height:100%;background:#033da9;color:#fff;font:16px system-ui,-apple-system,Segoe UI,sans-serif}
#s{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:24px}
#s img{width:84px;height:84px;border-radius:18px;margin-bottom:14px}
#s b{letter-spacing:3px;font-size:13px;opacity:.9}
#s p{opacity:.85;margin:10px 0 0;max-width:290px}
#s button{margin-top:16px;background:#fff;color:#033da9;border:0;border-radius:12px;padding:12px 26px;font-weight:800;font-size:15px}
</style></head><body>
<div id="s"><img src="icon-192.png" alt=""><b>SAINTS BASEBALL</b><p id="m">Loading…</p></div>
<script>
/* Loader shell: fetches the newest app page from Apps Script every time it opens,
   keeps a saved copy for bad signal, and writes it into this page.
   Updating the app = replacing "TMU Ramp App Page.html" in Drive. Nothing to re-upload here. */
(function(){
 var API=window.TMU_API||"",K="tmu_app_html",HEAD='<meta name="theme-color" content="#2f64e0"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Saints Baseball">';
 if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
 function saved(){try{return localStorage.getItem(K)}catch(e){return null}}
 function show(html){document.open();document.write(HEAD+html);document.close()}
 function fail(msg){var m=document.getElementById("m");if(!m)return;m.textContent=msg;var b=document.createElement("button");b.textContent="Try again";b.onclick=function(){location.reload()};m.parentNode.appendChild(b)}
 function go(){
  var done=false,ctl=window.AbortController?new AbortController():null,t=setTimeout(function(){if(ctl)ctl.abort();},8000);
  fetch(API+(API.indexOf("?")<0?"?":"&")+"raw=1&_="+Date.now(),ctl?{signal:ctl.signal}:{}).then(function(r){return r.json()}).then(function(j){
   clearTimeout(t);if(done)return;done=true;
   if(j&&j.html){try{localStorage.setItem(K,j.html)}catch(e){}show(j.html)}
   else throw new Error(j&&j.error||"no page");
  }).catch(function(e){
   clearTimeout(t);if(done)return;done=true;
   var c=saved();
   if(c){show(c);return}
   /* no saved copy and the loader mode is not available: open the app straight from Apps Script instead */
   if(API&&navigator.onLine!==false&&!/[?&]noredirect/.test(location.search)){location.replace(API);return}
   fail("Can't reach the server. Check your connection.");
  });
 }
 if(!API){fail("This app isn't set up yet (config.js is missing the web app address).")}else go();
})();
</script></body></html>
