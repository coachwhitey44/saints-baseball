<script src="config.js"></script>
<title>Saints Baseball</title>
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#17202b;--mut:#5f6874;--line:#dedad0;--acc:#2f64e0;--accink:#fff;--gold:#0b2a6f;--goldink:#fff;--warn:#b3261e;--ok:#17803f;--chip:#ebe8df;--nav:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1319;--card:#1a2029;--ink:#eeece6;--mut:#99a1ac;--line:#2f3641;--acc:#7aa2ff;--accink:#0a1f55;--gold:#bcd0ff;--goldink:#0b2a6f;--warn:#ff8a80;--ok:#6fd49a;--chip:#252c37;--nav:#141a22}}
:root[data-theme="dark"]{--bg:#0f1319;--card:#1a2029;--ink:#eeece6;--mut:#99a1ac;--line:#2f3641;--acc:#7aa2ff;--accink:#0a1f55;--gold:#bcd0ff;--goldink:#0b2a6f;--warn:#ff8a80;--ok:#6fd49a;--chip:#252c37;--nav:#141a22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.2px;line-height:1.1}.brand img{width:46px;height:46px;border-radius:10px;flex:none}.brand small{display:block;font-weight:500;font-size:12px;color:var(--mut);letter-spacing:0;margin-top:2px}
.streak{background:var(--gold);color:var(--goldink);font-weight:800;border-radius:999px;padding:6px 12px;font-size:15px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.card h3{margin:0 0 4px;font-size:16px}.mut{color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;background:linear-gradient(170deg,#0d4fd0 0%,#033da9 55%,#0b2a6f 100%);color:#fff;border-radius:22px;padding:26px 16px 22px;margin:8px 0 12px;box-shadow:0 8px 24px rgba(3,61,169,.28)}
.cover img{width:min(62vw,230px);height:auto;border-radius:30px;box-shadow:0 6px 22px rgba(0,0,0,.35)}.cover .cv1{margin-top:16px;font-weight:900;font-size:24px;letter-spacing:1.5px}.cover .cv2{margin-top:4px;opacity:.85;font-size:14px}
.hero{background:linear-gradient(165deg,#3b72ee,#2554cf);color:#fff;border-color:#2f64e0}.hero .mut{color:inherit;opacity:.85}
.strip{display:grid;grid-template-columns:36px repeat(7,1fr) 36px;gap:4px;align-items:center;margin:6px 0}
.strip button.d{padding:6px 0;min-height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;line-height:1.1}
.strip button.d b{font-size:17px}.strip button.d.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}.strip button.d.td{box-shadow:0 0 0 2px var(--gold)}
.strip .arr{padding:0;min-height:44px}
.dot{font-size:11px;height:13px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer;min-height:44px}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}button:disabled{opacity:.5}
.subs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.subs button{padding:10px 2px;min-height:48px;font-size:14px;font-weight:600;position:relative}.subs button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.subs .ck{position:absolute;top:2px;right:6px;font-size:11px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.scale label{display:block}.scale input{position:absolute;opacity:0}
.scale span{display:block;text-align:center;padding:12px 0;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;font-weight:700;min-height:48px;color:var(--ink)}
.hero .scale span{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);color:#fff}
.scale input:checked+span{background:var(--gold);color:var(--goldink);border-color:var(--gold);transform:scale(1.04)}.hero .scale input:checked+span{background:#fff;color:#0b2a6f;border-color:#fff}
.scale input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.big{font-size:19px;font-weight:700;margin:4px 0}.off{color:var(--mut);font-weight:500}
.line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
input[type=number],input[type=text],input[type=password],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px;min-height:44px}
input[type=number]{width:96px}textarea{width:100%;min-height:60px;resize:vertical}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:600}.chk input{width:24px;height:24px;accent-color:var(--ok)}
.cap{font-size:14px;padding:4px 10px;border-radius:8px;background:var(--chip)}.cap.over{color:var(--warn);font-weight:700}
.ex{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.ex:first-of-type{border-top:0}
.ex .cd{font-weight:800;color:var(--mut)}.ex b{display:block}.ex input{width:84px}
.pr{background:var(--gold);color:var(--goldink);font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;margin-left:6px}
details{margin:8px 0}summary{cursor:pointer;font-weight:700;min-height:36px;display:flex;align-items:center}
ul.l{margin:6px 0 6px 18px;padding:0}ul.l li{margin:3px 0}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav div{display:flex;width:100%;max-width:760px}
.nav button{flex:1;border:0;border-radius:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px;font-weight:600;padding:10px 2px;min-height:74px;color:var(--mut)}
.nav button span{font-size:27px;line-height:1.1}.nav button.on{color:var(--acc);font-weight:800}
@media (display-mode:browser) and (max-width:899px){.nav{padding-bottom:calc(env(safe-area-inset-bottom) + 34px)}body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}}
@media (min-width:900px){.nav{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}body{padding-bottom:20px;padding-top:70px}.nav button{flex-direction:row;justify-content:center;gap:8px;min-height:56px;font-size:14px}.nav button span{font-size:18px}}
.wk button[style] span{color:inherit;opacity:1}.tg{font-weight:800;margin-top:2px;font-size:8.5px;letter-spacing:-.3px}.tg2{font-size:9px;font-weight:700;letter-spacing:.2px}.wk button:not([style]) .tg2{color:var(--mut)}
.cb{display:block;width:70%;height:5px;border-radius:3px}.strip button.d.on .cb{box-shadow:0 0 0 1px #fff}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mut);margin:6px 0}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-top:8px}
.wk button{padding:5px 0;overflow:hidden;min-width:0;min-height:64px;font-size:11px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
.wk button b{font-size:14px}.wk button.td{box-shadow:0 0 0 2px var(--gold)}.wk button.ci{background:var(--chip)}
.tg{font-size:10px;font-weight:800;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
.tw{overflow-x:auto}.r-low{color:var(--warn);font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bd{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:13px;background:var(--bg)}.bd i{display:block;font-style:normal;font-size:28px}.bd.lock{opacity:.4;filter:grayscale(1)}
.msg{padding:10px 12px;border-radius:10px;background:var(--chip);margin:10px 0;font-size:14px}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);background:var(--gold);color:var(--goldink);font-weight:800;padding:12px 18px;border-radius:14px;z-index:20;max-width:92vw;text-align:center;transition:transform .35s ease;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.scale input:checked+span{transform:none}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:19}
.save{font-size:12px;color:var(--mut);min-height:16px}
.ex2{padding:10px 0;border-top:1px solid var(--line)}.ex2:first-of-type{border-top:0}.exh{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}.exh .cd{font-weight:800;color:var(--mut)}.exh b{display:block}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0 42px}.st{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}.st input{width:78px}
.medal{font-size:17px}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}

/* ---- polish pass ---- */
:root{--bg:#eef1f7;--card:#fff;--ink:#0d1b36;--mut:#5d6b82;--line:#e2e7f0;--acc:#1f56d6;--gold:#0b2a6f;--chip:#e8edf6;--nav:rgba(255,255,255,.92);--sh:0 1px 2px rgba(13,27,54,.06),0 4px 14px rgba(13,27,54,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a111f;--card:#141d2e;--ink:#eaf0fb;--mut:#9aa8c0;--line:#243049;--chip:#1c2740;--nav:rgba(16,24,40,.92);--sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25)}}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{padding:calc(10px + env(safe-area-inset-top)) 14px 12px}
.top{padding:4px 2px 10px}
.brand{font-size:18px}.brand img{width:44px;height:44px;border-radius:12px;box-shadow:var(--sh)}
.streak{background:linear-gradient(135deg,#0b2a6f,#1f56d6);color:#fff;box-shadow:0 2px 8px rgba(31,86,214,.35);padding:7px 13px}
.card{border:0;border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card h3{font-size:17px;font-weight:800;letter-spacing:-.2px;margin:0 0 6px}
.mut{line-height:1.4}
.hero{background:linear-gradient(160deg,#2a63e6 0%,#1346b8 60%,#0b2a6f 100%);box-shadow:0 8px 24px rgba(19,70,184,.35)}
.cover{border-radius:24px}
button{border-radius:14px;font-weight:600;transition:transform .08s ease,background .15s ease,box-shadow .15s ease;border:1px solid var(--line)}
button:active{transform:scale(.97)}
button.p{background:linear-gradient(180deg,#2a63e6,#1a4dc4);border-color:#1a4dc4;box-shadow:0 2px 8px rgba(31,86,214,.3)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(31,86,214,.35);outline-offset:1px}
input[type=number],input[type=text],input[type=password],input[type=date],input[type=email],select,textarea{border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px 12px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.subs{gap:8px}.subs button{border-radius:14px;background:var(--card);box-shadow:var(--sh);border:0}
.subs button.on{background:linear-gradient(180deg,#2a63e6,#1a4dc4);color:#fff}
.chips button{border-radius:999px}
.scale{gap:8px}.scale span{border-radius:14px;border:1.5px solid var(--line);background:var(--card);min-height:52px;font-size:18px;display:flex;align-items:center;justify-content:center;padding:0}
.scale input:checked+span{background:linear-gradient(180deg,#2a63e6,#0b2a6f);color:#fff;border-color:#0b2a6f;box-shadow:0 4px 12px rgba(11,42,111,.35)}
.hero .scale span{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);color:#fff}
.hero .scale input:checked+span{background:#fff;color:#0b2a6f;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.strip button.d{border-radius:14px;border:0;background:var(--card);box-shadow:var(--sh)}
.strip button.d.on{background:linear-gradient(180deg,#2a63e6,#1a4dc4);color:#fff}
.wk button{border-radius:12px;border:0;box-shadow:none}
.row{padding:9px 0;border-top:1px solid var(--line)}
.row b{font-weight:700}
.bd{border-radius:16px;border:0;background:var(--chip);padding:12px 8px}.bd.lock{opacity:.45}
.msg{border-radius:14px;background:var(--card);box-shadow:var(--sh);border-left:4px solid var(--acc)}
.nav{background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(13,27,54,.08)}
.nav button{position:relative;background:transparent;box-shadow:none;border:0;border-radius:0;transition:color .15s}
.nav button.on{color:var(--acc)}
.nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--acc)}
.nav button.on span{transform:translateY(-1px) scale(1.08)}
.nav button span{transition:transform .15s}
table{font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
details.card summary{font-size:15px}
::selection{background:rgba(31,86,214,.25)}
html{scroll-behavior:smooth}
@media (min-width:900px){.wrap{padding-top:12px}.nav button.on::before{top:auto;bottom:0;border-radius:4px 4px 0 0}}
#toast{transform:translate(-50%,-220%);visibility:hidden;top:calc(12px + env(safe-area-inset-top))}#toast.on{transform:translate(-50%,0);visibility:visible}
.subs.sc{display:flex;overflow-x:auto;gap:8px;padding:4px 2px 8px;margin:8px -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.subs.sc::-webkit-scrollbar{display:none}.subs.sc button{flex:none;padding:10px 16px;white-space:nowrap;min-height:46px;border-radius:999px}
a{color:var(--acc)}ul.l a{text-decoration:none;font-weight:600}ul.l li{margin:6px 0}
</style>

  const done=t=>{try{const j=typeof t==="string"?JSON.parse(t):t;j.error?rej(new Error(j.error)):res(j)}catch(e){rej(e)}};
  if(window.google&&google.script&&google.script.run)google.script.run.withSuccessHandler(done).withFailureHandler(e=>rej(new Error((e&&e.message)||e))).api(body);
  else fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body}).then(r=>r.text()).then(done).catch(rej)})}

 return queue(async()=>{try{await call("save",{...creds(),entries:ent,weights:w,profile:prof});status="Saved ✓";paintStatus()}catch(e){sE.forEach(k=>dirtyE.add(k));sW.forEach(k=>dirtyW.add(k));if(sP)dirtyP=true;throw e}})}

 h=pinnedBar()+(boardErr?`<div class="msg">${esc(boardErr)}</div>`:"")+h;
 const L=liftList();if(!bsel&&L.length)bsel=L[0][0];
 if(bsub==="goal")return h+goalCard(true);

 if(bsub==="p4p")return h+p4pView();
 if(bsub==="cage")return h+cageView();
 if(bsub==="lifts"){
  h+=`<div class="card"><h3>Top 3 per lift</h3><div class="mut">Heaviest single-set weight logged. Gold, silver, bronze.</div>`;
  h+=`<select data-act="bsel">${L.map(([id,n])=>`<option value="${esc(id)}" ${bsel===id?"selected":""}>${esc(n)}</option>`).join("")}</select>`;
  const rows=board.map(r=>({n:r.name,w:+((r.lifts||{})[bsel]||0)})).filter(r=>r.w>0).sort((a,b)=>b.w-a.w).slice(0,3);
  h+=rows.length?rows.map((r,i)=>`<div class="row medal m${i}"><span>${MEDAL[i]} ${esc(r.n)}${me&&r.me&&n===me.name?" (you)":""}</span><b>${r.w} lb</b></div>`).join(""):'<div class="mut" style="margin-top:8px">No weights logged for this lift yet. Be the first on the board.</div>';
  h+=`</div><div class="card"><h3>Medal count</h3><div class="mut">Gold, silver and bronze across every lift.</div>`;
  const mc={};for(const[id]of L){board.map(r=>({n:r.name,w:+((r.lifts||{})[id]||0)})).filter(r=>r.w>0).sort((a,b)=>b.w-a.w).slice(0,3).forEach((r,i)=>{(mc[r.n]=mc[r.n]||[0,0,0])[i]++})}
  const mr=Object.entries(mc).sort((a,b)=>(b[1][0]-a[1][0])||(b[1][1]-a[1][1])||(b[1][2]-a[1][2]));
  h+=mr.length?mr.map(([n,c])=>`<div class="row"><span>${esc(n)}${me&&n===me.name?" (you)":""}</span><b>🥇${c[0]} 🥈${c[1]} 🥉${c[2]}</b></div>`).join(""):'<div class="mut" style="margin-top:8px">No medals yet.</div>';
  return h+`</div>`}
 if(bsub==="prs")return h+chatView();
 if(bsub==="streaks"){
  const rows=board.slice().sort((a,b)=>(b.streak-a.streak)||(b.total-a.total));
  h+=`<div class="card"><h3>🔥 Team streaks</h3><div class="mut">Consecutive days checked in. Don't break the chain.</div>`;
  h+=rows.length?rows.map((r,i)=>`<div class="row"><span>${MEDAL[i]||(i+1)+"."} ${esc(r.name||"Player")}${me&&r.name===me.name?" (you)":""}</span><b>${r.streak||0} 🔥 <span class="mut">(${r.total||0} total)</span></b></div>`).join(""):'<div class="mut">Nobody has checked in yet. Be first.</div>';
  return h+`</div>`}
 const s=stats();h+=`<div class="card"><h3>⭐ My bests</h3><div class="mut">Your heaviest set for each lift, and where you rank.</div>`;
 const mine=L.map(([id,n])=>{const w=s.maxLift[id]||0;if(!w)return"";const rank=board.filter(r=>+((r.lifts||{})[id]||0)>w).length;return `<div class="row"><span>${esc(n)}</span><b>${w} lb ${rank<3?MEDAL[rank]:""}</b></div>`}).join("");
 return h+(mine||'<div class="mut" style="margin-top:8px">Log weights in the Lift tab and your bests show up here.</div>')+`</div>`}
function meView(){
 const s=stats(),g=groupOf();
 let h=`<div class="card"><h3>${esc(me.name||"")}</h3><div class="mut">${ROLES[myRole()]}${showThrow()?" · throwing plan from your personal sheet":""}</div><div class="row"><span>Current streak</span><b>${s.streak} 🔥</b></div><div class="row"><span>Best streak</span><b>${s.best}</b></div><div class="row"><span>Check-ins</span><b>${s.total}</b></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;text-align:center">${[["🏋️","Lifts",s.lifts],["⚡","Sprints",s.sprints],["⚾","Throws",s.throws],["🧘","Mobility",s.mobs]].filter(x=>x[1]!=="Throws"||showThrow()).map(([i,n,v])=>`<div style="background:var(--chip);border-radius:14px;padding:10px 2px"><div style="font-size:20px">${i}</div><div style="font-size:20px;font-weight:800">${v}</div><div class="mut" style="font-size:11px">${n}</div></div>`).join("")}</div></div>`;
 h+=`<div class="card"><h3>Badges · ${BADGES.filter(b=>b[3](s)).length} of ${BADGES.length}</h3><div class="badges">${BADGES.slice().sort((a,b)=>b[3](s)-a[3](s)).map(([ic,n,d,f])=>`<div class="bd${f(s)?"":" lock"}"><i>${ic}</i><b>${n}</b><div class="mut" style="font-size:11px">${d}</div></div>`).join("")}</div></div>`;

 if(ctab==="viewas"){h+=`<p class="mut">Open the full app exactly as a player sees it: Today, every tab, Schedule, Weight, Board and Me. Read only, nothing you tap changes their data.</p><div class="card">${players.slice().sort((a,b)=>ROLEORD[roleFor(a.id,a.group)]-ROLEORD[roleFor(b.id,b.group)]).map(p=>`<div class="row"><span>${esc(p.name)}<br><span class="mut">${ROLES[roleFor(p.id,p.group)]}</span></span><button data-act="vas" data-id="${p.id}">Open</button></div>`).join("")}</div>`;return h}
 if(ctab==="detail"){h+=`<select data-act="dsel"><option value="">Choose player…</option>${players.map(p=>`<option value="${p.id}" ${dsel===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select>`;
  const p=players.find(x=>x.id===dsel);
  if(p){const E=p.entries||{},g=p.group,mx=+p.fallMax;
   h+=`<div class="card"><h3>${esc(p.name)}</h3><div class="mut">${hasThrow(p.id)?"Pitcher":"Position player"}${mx?" · fall max "+mx:""}${p.joined?"":" · hasn't signed in yet (seeded history only)"}</div></div>`;
   const wk=Object.keys(p.weights||{}).sort();if(wk.length)h+=`<div class="card"><h3>Body weight</h3>${chart(wk.slice(-40).map(k=>[k,+p.weights[k]]),Math.floor(Math.min(...wk.map(k=>+p.weights[k]))-1),Math.ceil(Math.max(...wk.map(k=>+p.weights[k]))+1))}<div class="mut">Latest ${p.weights[wk[wk.length-1]]} lb</div></div>`;
   const ks=Object.keys(E).sort().reverse();
   h+=`<div class="tw"><table><tr><th>Date</th><th>Plan</th><th>R</th><th>MPH</th><th>Cap</th><th>Done</th><th>Note</th></tr>${ks.map(k=>{const e=E[k],w=weekOf(k),t=hasThrow(p.id)&&w>=0&&w<13?thFor(p.id,w,dIdx(k)):"",cap=capFor(mx,t);return `<tr><td>${k.slice(5)}</td><td>${esc(t.slice(0,38))}</td><td class="${+e.r<=4?"r-low":""}">${e.r||""}</td><td class="${cap&&+e.mph>cap?"r-low":""}">${e.mph||""}</td><td>${cap??""}</td><td>${e.throwDone?"T":""}${e.liftDone?"L":""}${e.sprintDone?"S":""}${e.mobDone?"M":""}</td><td>${esc(e.note||"")}</td></tr>`}).join("")}</table></div>`}

function redFlags(){const out=[],tk=todayKey(),y=addDays(tk,-1);
 for(const p of players){const E=p.entries||{},mx=+p.fallMax,ks=Object.keys(E).filter(k=>E[k].r).sort(),f=[];
  const last3=ks.slice(-3).map(k=>+E[k].r);
  if(last3.length===3&&last3.every(x=>x<=4))f.push([3,"Low readiness 3 check-ins in a row ("+last3.join(", ")+")"]);
  else if(ks.length&&ks[ks.length-1]>=y&&+E[ks[ks.length-1]].r<=3)f.push([2,"Readiness "+E[ks[ks.length-1]].r+" ("+ks[ks.length-1].slice(5)+")"]);
  for(let n=0;n<7;n++){const k=addDays(tk,-n),e=E[k];if(!e||!e.mph)continue;const w=weekOf(k),t=hasThrow(p.id)&&w>=0&&w<13?thFor(p.id,w,dIdx(k)):"",cap=capFor(mx,t);if(cap!=null&&+e.mph>cap){f.push([3,"Over MPH cap "+e.mph+" vs "+cap+" ("+k.slice(5)+")"]);break}}
  const arm=new Set(["lsh","rsh","lel","rel"]);
  for(let n=0;n<3;n++){const e=E[addDays(tk,-n)];if(!e||!e.sore)continue;const hit=Object.keys(e.sore).filter(x=>e.sore[x]>=2);if(hit.length){const names=hit.map(x=>(SORE.find(s=>s[0]===x)||[0,x])[1]+" ("+SORENAME[e.sore[x]]+")");f.push([hit.some(x=>arm.has(x)||e.sore[x]>=3)?3:2,"Sore: "+names.join(", ")+" ("+addDays(tk,-n).slice(5)+")"]);break}}
  if(p.joined&&tk>="2026-11-16"&&tk<="2027-02-14"){let miss=0;for(let n=1;n<=7;n++){if(E[addDays(tk,-n)]&&E[addDays(tk,-n)].r)break;miss++}if(miss>=2&&!(E[tk]&&E[tk].r))f.push([1,"No check-in for "+miss+" days"])}
  if(f.length)out.push({p,f,sev:Math.max(...f.map(x=>x[0]))})}
 return out.sort((a,b)=>b.sev-a.sev)}
function flagsCard(){const r=redFlags();const col=["","#6b7280","#ff6d01","#c5221f"];
 if(!players.length)return"";
 let h=`<div class="card"><h3>🚩 Red flags${r.length?" ("+r.length+")":""}</h3>`;
 h+=r.length?r.map(x=>`<div class="row"><span><b>${esc(x.p.name)}</b>${x.f.map(([s,t])=>`<br><span style="color:${col[s]}">● ${esc(t)}</span>`).join("")}</span><button data-act="vas" data-id="${x.p.id}">Open</button></div>`).join(""):'<div class="mut">Nothing flagged. Everyone looks good. ✅</div>';
 return h+`<div class="mut" style="margin-top:6px;font-size:12px">Flags: readiness 4 or below three days running, over MPH cap, arm or moderate soreness, 2+ missed check-ins.</div></div>`}
function exportCsv(){const rows=[["player","role","date","readiness","top_mph","cap","throw_done","lift_done","sprint_done","mobility_done","hit_minutes","hit_type","note"]];
 for(const p of players){const g=p.group,mx=+p.fallMax;for(const k of Object.keys(p.entries||{}).sort()){const e=p.entries[k],w=weekOf(k),t=hasThrow(p.id)&&w>=0&&w<13?thFor(p.id,w,dIdx(k)):"";rows.push([p.name,g||"",k,e.r||"",e.mph||"",capFor(mx,t)??"",e.throwDone?1:"",e.liftDone?1:"",e.sprintDone?1:"",e.mobDone?1:"",(e.hit&&e.hit.min)||"",(e.hit&&e.hit.type)||"",e.note||""])}
  for(const k of Object.keys(p.weights||{}).sort())rows.push([p.name,g||"",k,"","","","","","","","","","weigh-in "+p.weights[k]+" lb"])}
 const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="thomas_more_ramp_log.csv";document.body.appendChild(a);a.click();a.remove()}

const cover=(sub)=>`<div class="cover"><img src="${LOGO}" alt="Saints Baseball"><div class="cv1">SAINTS BASEBALL</div><div class="cv2">${sub}</div></div>`;
function loginCard(){ return cover("Winter Ramp · Daily check-in")+`<div class="card"><div class="mut" style="margin-bottom:8px">Pick your name and sign in. Each day: sign in, give your readiness number. That's the bare minimum and we'll celebrate it. ⚾</div>
 <label class="mut">Your name</label><br><select id="pick"><option value="">Select your name…</option>${roster.map(p=>`<option value="${p.id}" ${p.id===loginPick?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
 <div class="line"><button class="p" data-act="login">Sign in</button></div>${loginErr?`<div class="msg">${esc(loginErr)}</div>`:""}</div>`}
function paint(){
 const a=$("app"),nav=$("nav");
 if(err){a.innerHTML=`<div class="msg">${esc(err)}</div>`;nav.innerHTML="";return}
 if(!loaded){a.innerHTML=cover("Loading…");nav.innerHTML="";return}
 if(!me&&!isCoach){a.innerHTML=loginCard()+(showCoachLogin?`<div class="card"><div class="line"><input type="password" id="cpin" placeholder="Coach code" inputmode="numeric" style="width:160px"><button data-act="clogin">Coach sign-in</button></div></div>`:`<p class="mut" style="text-align:center"><a href="#" data-act="cshow">Coach sign-in</a></p>`);nav.innerHTML="";return}
 const T=isCoach?(viewing?TABS:[["today","📅","Today"],["sched","🗓️","Schedule"],["team","🏅","Board"],["roster","👥","Roster"],["coach","🧢","Coach"]]):TABS;
 if(!isCoach&&tab==="coach")tab="today";
 nav.innerHTML=T.map(([c,ic,l])=>`<button class="${tab===c?"on":""}" data-act="tab" data-t="${c}"><span>${ic}</span>${l}</button>`).join("");
 const s=me?stats():null;$("who").textContent=me?me.name+" · Winter Ramp":"Coach · Winter Ramp";
 const sk=$("stk");if(s){sk.hidden=false;sk.textContent="🔥 "+s.streak}else sk.hidden=true;
 const body=tab==="coach"?coachView():tab==="roster"?rosterView():!me?loginCard()+`<div class="msg">You're signed in as Coach. Sign in as a player to use the player screens.</div>`:tab==="today"?todayView():tab==="sched"?schedView():tab==="weight"?weightView():tab==="team"?teamView():tab==="roster"?rosterView():meView();
 const bn=viewing?`<div class="msg" style="position:sticky;top:0;z-index:4">👁 Coach view: ${esc(me.name)} (read only). <button data-act="vexit">Back to Coach</button></div>`:"";
 const y=scrollY;a.innerHTML=bn+body;scrollTo(0,y)}
// ---------- events ----------
function arm(b,label){if(b.dataset.armed){return true}b.dataset.armed="1";b.dataset.old=b.textContent;b.textContent=label;setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=b.dataset.old}},3000);return false}
const A=$("app");
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;
 if(act==="day"||act==="open"){sel=b.dataset.k;tab="today";paint();scrollTo(0,0)}
 else if(act==="wk"){sel=addDays(sel,+b.dataset.n);paint()}
 else if(act==="htt"){const k=b.dataset.k,t=b.dataset.t,cur=((((ents()[k]||{}).x||{}).ht||{}).types)||[];const nx=cur.includes(t)?cur.filter(z=>z!==t):[...cur,t];setHT(k,{types:nx});if(nx.length>cur.length)celebrate("Throwing logged ⚾ "+t);paint()}
 else if(act==="hchip"){setHit(b.dataset.k,{min:+b.dataset.n});celebrate("Hitting logged 🏏 "+b.dataset.n+" min");paint()}
 else if(act==="sub"){sub=b.dataset.s;paint()}
 else if(act==="bs"){bsub=b.dataset.s;paint()}
 else if(act==="sore"){const kk=b.dataset.k,p=b.dataset.p,cur={...((ents()[kk]||{}).sore||{})};const nx=((cur[p]||0)+1)%4;if(nx)cur[p]=nx;else delete cur[p];setEntry(kk,{sore:cur});paint()}
 else if(act==="cpost"){const el=$("cm"),tx=(el.value||"").trim();if(!tx)return;b.disabled=true;call("chatPost",me?{...creds(),text:tx}:{coachPin,text:tx}).then(r=>{chat=r.chat||chat;paint()}).catch(e=>{status=e.message;b.disabled=false;celebrate(e.message)})}
 else if(act==="cdel"){if(arm(b,"Sure?"))call("chatDelete",{coachPin,id:b.dataset.id}).then(r=>{chat=r.chat||chat;paint()}).catch(e=>celebrate(e.message))}
 else if(act==="ppost"){const tx=$("pt").value.trim();call("coachSetPinned",{coachPin,text:tx}).then(()=>{pinned=tx?{text:tx}:null;status=tx?"Pinned ✓":"Cleared";paint()}).catch(e=>{status=e.message;paint()})}
 else if(act==="vexit"){viewing=false;me=stash;stash=null;tab="coach";ctab="viewas";paint()}
 else if(act==="vas"){const p=players.find(x=>x.id===b.dataset.id);if(p){if(!viewing)stash=me;viewing=true;me={playerId:p.id,name:p.name,group:p.group,fallMax:p.fallMax,goalWeight:p.goalWeight,entries:JSON.parse(JSON.stringify(p.entries||{})),weights:{...(p.weights||{})}};tab="today";sel=todayKey();paint();loadBoard();scrollTo(0,0)}}
 else if(act==="ct"){ctab=b.dataset.s;paint();if(ctab==="board")loadBoard()}
 else if(act==="cshow"){ev.preventDefault();showCoachLogin=true;paint()}
 else if(act==="login"){const id=$("pick").value;loginPick=id;if(!id){loginErr="Pick your name first.";paint();return}
  b.disabled=true;call("login",{playerId:id}).then(r=>{me=r.me;if(r.program)program=normProg(r.program);me.entries=me.entries||{};me.weights=me.weights||{};loginErr="";store.set("tmu_cred",JSON.stringify({playerId:id}));tab="today";paint();loadBoard()}).catch(e=>{loginErr=e.message;paint()})}
 else if(act==="clogin"){const p=$("cpin").value;call("coachCheck",{coachPin:p}).then(()=>{coachPin=p;isCoach=true;store.set("tmu_coach",p);loadCoach()}).catch(e=>{loginErr="Wrong coach code";showCoachLogin=true;paint()})}
 else if(act==="logout"){store.del("tmu_cred");me=null;pin="";tab="today";paint()}
 else if(act==="esave"){me.email=($("em").value||"").trim();dirtyP=true;saveMe().then(()=>{celebrate("Reminder email saved ✉️");paint()})}
 else if(act==="msave"){me.fallMax=+$("mx").value||0;dirtyP=true;saveMe().then(paint)}
 else if(act==="wlog"){const d=$("wd").value,v=+$("wv").value;if(!d||!v)return;me.weights={...(me.weights||{}),[d]:v};dirtyW.add(d);saveMe().then(()=>{celebrate("Weigh-in logged. ⚖️ Consistency wins.");paint()})}
 else if(act==="gsave"){me.goalWeight=+$("gw").value||0;dirtyP=true;saveMe().then(paint)}
 else if(act==="wdel"){const w={...me.weights};delete w[b.dataset.k];me.weights=w;dirtyW.add(b.dataset.k);saveMe().then(paint)}
 else if(act==="crefresh")loadCoach();
 else if(act==="cycopy"){const cy=cycleAt(todayKey())||program;cyDraft={name:"",start:(cyDraft&&cyDraft.start)||"",t:["d1","d2","d3"].map(id=>((cy.days||[]).find(x=>x.id===id)||{}).title||""),x:["d1","d2","d3"].map(id=>liftsToText(((cy.days||[]).find(x=>x.id===id)||{lifts:[]}).lifts))};const cs=program.cycles;cyDraft.start=nextMonday(addDays(cs.slice().sort((a,b)=>a.start<b.start?1:-1)[0].start||CYCLE1,28));paint()}
 else if(act==="cyadd"){const d=readCy();cyDraft=d;const cs=program.cycles||[];
  if(!d.name){status="Give the cycle a name.";paint();return}
  if(!d.start||new Date(d.start+"T12:00:00").getDay()!==1){status="The start date has to be a Monday.";paint();return}
  if(cs.some(c=>c.start===d.start)){status="There is already a cycle starting that day.";paint();return}
  const used=new Set(),days=[0,1,2].map(i=>({id:"d"+(i+1),title:d.t[i]||"Day "+(i+1),lifts:parseLifts(d.x[i],used)}));
  if(days.some(x=>!x.lifts.length)){status="Each day needs at least one exercise line.";paint();return}
  const cy={name:d.name,start:d.start,dayMap:{"0":"d1","2":"d2","3":"d3"},days};
  const prog={...program,cycles:[...cs,cy].sort((a,b)=>(a.start||"")<(b.start||"")?-1:1)};
  status="Saving…";paint();call("coachSaveProgram",{coachPin,program:prog}).then(()=>{program=normProg(prog);cyDraft=null;celebrate("Cycle added ✅");status="Cycle "+d.name+" added. Starts "+d.start}).catch(e=>{status=e.message}).then(()=>paint())}
 else if(act==="cydel"){if(!arm(b,"Tap again to delete"))return;const prog={...program,cycles:program.cycles.filter((c,i)=>i!==+b.dataset.i)};call("coachSaveProgram",{coachPin,program:prog}).then(()=>{program=normProg(prog);status="Cycle deleted"}).catch(e=>{status=e.message}).then(()=>paint())}
 else if(act==="rdel"){if(arm(b,"Sure?")){rost.splice(+b.dataset.i,1);paint()}}
 else if(act==="radd"){rost.push({id:"p"+Date.now().toString(36),name:"New player",group:"",fallMax:0,email:""});paint()}
 else if(act==="rpin"){const p=rost[+b.dataset.i];if(arm(b,"Sure?"))call("coachResetPin",{coachPin,id:p.id}).then(()=>{status="PIN reset";loadCoach()}).catch(e=>{status=e.message;paint()})}
 else if(act==="rsave"){status="Saving…";paint();call("coachSaveRoster",{coachPin,players:rost}).then(()=>{status="Roster saved";loadCoach()}).catch(e=>{status=e.message;paint()})}
 else if(act==="psave"){try{const j=JSON.parse($("pj").value);status="Saving…";paintStatus();call("coachSaveProgram",{coachPin,program:j}).then(()=>{program=normProg(j);status="Program saved"}).catch(e=>{status=e.message}).then(paintStatus)}catch(e){status="That isn't valid JSON: "+e.message;paintStatus()}}
 else if(act==="csv")exportCsv();
 else if(act==="tab"){tab=b.dataset.t;paint();scrollTo(0,0);if(tab==="team"&&me)loadBoard();if(tab==="roster")loadActivity();if(tab==="coach"&&isCoach)loadCoach()}});

document.addEventListener("change",ev=>{const t=ev.target,act=t.dataset.act;if(!act)return;const k=t.dataset.k;
 if(act==="bsel"){bsel=t.value;paint();return}
 if(act==="p4sel"){p4sel=t.value;paint();return}
 if(act==="cagesel"){cagesel=t.value;paint();return}
 if(act==="xchk"){setX(k,{[t.dataset.f]:t.checked});if(t.checked)celebrate("Checked off. ✅");paint();return}
 if(act==="hmin"){const before=+((ents()[k]||{}).hit||{}).min||0,v=t.value===""?"":+t.value;setHit(k,{min:v});if(v&&!before)celebrate("Hitting logged 🏏 "+v+" min");paint();return}
 if(act==="htype"){setHit(k,{type:t.value});return}
 if(act==="r"){const had=!!(ents()[k]&&ents()[k].r);setEntry(k,{r:+t.value});const s=stats();
  if(k===todayKey()||!had)celebrate(msgFor(+t.value,s.streak));paint()}
 else if(act==="chk"){setEntry(k,{[t.dataset.f]:t.checked});if(t.checked)celebrate(["Done. Nice work. ✅","Box checked. Keep stacking. 💪","That's how it's built. 🔥"][Math.floor(Math.random()*3)]);paint()}
 else if(act==="mph"){setEntry(k,{mph:t.value===""?"":+t.value});paint()}
 else if(act==="ls"){const id=t.dataset.id,i=+t.dataset.i,n=+t.dataset.n,cur=((ents()[k]||{}).lifts||{})[id];let arr=Array.isArray(cur)?cur.slice():(cur?[cur]:[]);while(arr.length<n)arr.push("");arr[i]=t.value===""?"":+t.value;const before=topOf(cur),pm=prevMax(id,k),v=+t.value||0;const L={...((ents()[k]||{}).lifts||{}),[id]:arr};setEntry(k,{lifts:L});if(v&&pm&&v>pm&&v>before){celebrate("NEW PR! 🏆💥 "+exName(id)+" "+v+" lb");paint()}}
 else if(act==="grp"){me.group=t.value;dirtyP=true;saveMe().then(paint)}
 else if(act==="dsel"){dsel=t.value;paint()}
 else if(act==="rf"){const i=+t.closest("tr").dataset.i,f=t.dataset.f;rost[i][f]=f==="fallMax"?(+t.value||0):t.value}});
document.addEventListener("input",ev=>{const t=ev.target;if(t.dataset.act==="note")setEntry(t.dataset.k,{note:t.value});if(t.dataset.act==="hnote")setHit(t.dataset.k,{note:t.value});if(t.dataset.act==="htnote")setHT(t.dataset.k,{note:t.value})});
// ---------- init ----------
async function init(){
 paint();
 try{
  const b=await call("boot",{});roster=b.roster;pinned=b.pinned||null;program=normProg(b.program||DEFAULT_PROGRAM);
  let c=null;try{c=JSON.parse(store.get("tmu_cred")||"null")}catch(e){}
  if(c){try{const r=await call("login",c);me=r.me;if(r.program)program=normProg(r.program);me.entries=me.entries||{};me.weights=me.weights||{};loadBoard()}catch(e){store.del("tmu_cred")}}
  const cp=store.get("tmu_coach");if(cp){try{await call("coachCheck",{coachPin:cp});coachPin=cp;isCoach=true;loadCoach()}catch(e){store.del("tmu_coach")}}
 }catch(e){err="Couldn't reach the server. Check your connection and reload. ("+(e.message||e)+")"}
 loaded=true;paint();
}
init();

</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
